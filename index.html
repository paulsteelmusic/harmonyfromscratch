<script>
/* ===== MUSIC ENGINE (no DOM) ===== */
const LET = ['C','D','E','F','G','A','B'];
const NATPC = [0,2,4,5,7,9,11];
const mod = (n,m) => ((n % m) + m) % m;
const note = (l,a=0) => ({l,a});
const pc = n => mod(NATPC[n.l] + n.a, 12);
const accStr = a => a===0 ? '' : a>0 ? '♯'.repeat(a) : '♭'.repeat(-a);
const nm = n => LET[n.l] + accStr(n.a);
const sameNote = (a,b) => a && b && a.l===b.l && a.a===b.a;
const N = s => parseNote(s);

function parseNote(s){
  s = String(s).trim();
  const m = s.match(/^([A-Ga-g])(.*)$/);
  if(!m) return null;
  let a = 0;
  for(const ch of m[2].replace(/\s/g,'')){
    if(ch==='#'||ch==='♯') a++;
    else if(ch==='b'||ch==='♭'||ch==='B') a--;
    else if(ch==='x'||ch==='𝄪') a+=2;
    else if(ch==='♮') {}
    else return null;
  }
  return note(LET.indexOf(m[1].toUpperCase()), a);
}

/* Spell the note that is `ls` letters above root and `semis` semitones above it */
function spellInterval(root, ls, semis){
  const l = mod(root.l + ls, 7);
  const target = mod(pc(root) + semis, 12);
  let d = mod(target - NATPC[l], 12);
  if(d > 6) d -= 12;
  return note(l, d);
}

/* ---- scales ---- */
const SCALES = {
  major:    [2,2,1,2,2,2,1],
  minor:    [2,1,2,2,1,2,2],
  harmonic: [2,1,2,2,1,3,1],
};
const BASE = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10] };
function scaleNotes(root, type){
  const st = SCALES[type]; const out = []; let s = 0;
  for(let i=0;i<7;i++){ out.push(spellInterval(root,i,s)); s += st[i]; }
  return out;
}
const isClean = notes => notes.every(n => Math.abs(n.a) <= 1);
const sigCount = (root,type) => {
  const sc = scaleNotes(root,type);
  return { sharps: sc.filter(n=>n.a>0).length, flats: sc.filter(n=>n.a<0).length };
};
const sigText = (root,type) => { const s = sigCount(root,type); return s.sharps ? s.sharps+(s.sharps>1?' sharps':' sharp') : s.flats ? s.flats+(s.flats>1?' flats':' flat') : 'no sharps or flats'; };

const MAJOR_KEYS = ['C','G','D','A','E','B','F♯','C♯','F','B♭','E♭','A♭','D♭','G♭'].map(parseNote);
const MINOR_KEYS = ['A','E','B','F♯','C♯','G♯','D','G','C','F','B♭','E♭'].map(parseNote);
const FIFTHS = ['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'].map(parseNote);
const relMinor = r => scaleNotes(r,'major')[5];
const relMajor = r => scaleNotes(r,'minor')[2];

/* ---- chords ---- */
const Q = {
  maj:  {iv:[[0,0],[2,4],[4,7]],           sym:'',        name:'major'},
  min:  {iv:[[0,0],[2,3],[4,7]],           sym:'m',       name:'minor'},

function playEvents(events, onStep, onEnd){

  newSession();

  let last = 0;
  events.forEach(ev => {
    const per = ev.midis.length > 1 ? 0.9/Math.sqrt(ev.midis.length) : 1;
    ev.midis.forEach(m => voiceNote(m, t0 + ev.t, ev.dur || 0.7, (ev.vel || 0.3) * per));
    last = Math.max(last, ev.t + (ev.dur || 0.7));

      const ms = [];

/* ---- Keyboard ---- */
function Keyboard(o={}){

  const WP = [0,2,4,5,7,9,11];
  const whites = []; for(let m=lo; m<=hi; m++) if(WP.includes(mod(m,12))) whites.push(m);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (t,a) => { const e = document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };

  const keys = {};

    const r = mk('rect', {x:i*W, y:0, width:W, height:H, class:'w', rx:3}); keys[m] = r; svg.append(r);

    return {cx: whites.indexOf(m)*W + W/2, cy: H-32, r:11, black:false};

    if(!keys[m]) return;

    g.append(mk('circle', {cx:c.cx, cy:c.cy, r:c.r}));

    layer.append(g);
  }

    layer.replaceChildren();
    const seen = new Set();
    api.base.forEach(e => { drawOne(e.m, e.role||'x', e.label||''); seen.add(e.m); });
    api.sel.forEach(m => { if(!seen.has(m)) drawOne(m, 'sel', ''); });

  api.clear = () => { api.base = []; api.sel.clear(); api.render(); };

    const m = +k;

      e.preventDefault();

    h('div',{class:'row'}, h('span',{class:'lab'},'Tap to add'), helpers, h('span',{class:'muted', style:'font-size:14px'}, o.kind==='chord'?'Type chords like F♯m, B♭, Dmaj7 (or Fm, Bb, D7).':'Type notes like F♯ or B♭ (you can also type F# and Bb).')));

/* Circle of fifths: outer ring majors, inner ring relative minors.
   The six diatonic chords of the selected key are the wedge of three segments around it. */
function CircleOfFifths(o={}){

function PivotFinder(){

    out.replaceChildren(
      h('div',{html: shared.length ? `<b>${nm(A)} major</b> and <b>${nm(B)} major</b> share <b>${shared.length}</b> chord${shared.length>1?'s':''}. Each one can act as a pivot.` : `<b>${nm(A)} major</b> and <b>${nm(B)} major</b> share no triads, so a pivot chord is not available. Use a direct change instead.`}),
      shared.length ? h('div',{class:'tscroll'}, h('table',{class:'tb'}, h('thead',{}, h('tr',{}, h('th',{},'Pivot chord'), h('th',{}, 'In '+nm(A)), h('th',{}, 'In '+nm(B)))),

function listen(evsFn){ return () => playEvents(evsFn()); }
function clip(specs, key, mode='major', beat=0.9){ const rs = specs.map(s => resolve(key,mode,s)); return progEvents(rs, beat); }
/* Difficulty ladder: attempt 0 = natural key, 1 = a few accidentals, 2 = trickier. One-shot exercises use the middle tier. */
const tierFor = (att, need) => need<=1 ? 1 : need===2 ? Math.min(att,1) : need>=4 ? (att<2?0:att<4?1:2) : Math.min(att,2);
/* a shuffled run of types where every type appears, then the least-used fill the rest */
function balSeq(types, n){ const seq = shuffle(types); while(seq.length<n){ const prev = seq[seq.length-1], cnt = t => seq.filter(x => x===t).length, m = Math.min(...types.map(cnt)); const c = types.filter(t => cnt(t)===m && t!==prev); seq.push(pick(c.length ? c : types.filter(t => t!==prev))); } return seq; }
const inTier = (n, t) => t===0 ? n===0 : t===1 ? (n>=1&&n<=3) : n>=4;
function lpick(a, n, type, list){
  const acc = r => scaleNotes(r,type).filter(x => x.a!==0).length, t = tierFor(a,n);
  for(const tt of [t, t===0?1:t-1, 1, 0, 2]){ const c = list.filter(r => inTier(acc(r),tt)); if(c.length) return pick(c); }
  return pick(list);
}
function kpick(type, att, need, filt){ let rs = rootsFor(type); if(filt) rs = rs.filter(filt); return lpick(att, need, type, rs); }
function lcpick(a, n, list, q){
  const acc = r => chordNotes(r,q).filter(x => x.a!==0).length, t = tierFor(a,n);
  for(const tt of [t, t===0?1:t-1, 1, 0, 2]){ const c = list.filter(r => inTier(acc(r),tt)); if(c.length) return pick(c); }
  return pick(list);
}
/* chords: one natural, one with a few accidentals, one trickier */
function cpicks(types){
  const pool = []; types.forEach(q => chordRoots(q).forEach(r => pool.push({r,q})));
  const a = p => chordNotes(p.r,p.q).filter(n => n.a!==0).length;
  const tier = [pool.filter(p => a(p)===0), pool.filter(p => a(p)===1||a(p)===2), pool.filter(p => a(p)>=2 && nm(p.r).length>1)];
  return tier.map((t,i) => pick(t.length ? t : pool));
}
const fifthIdx = (a,n) => pick([[0,1,11],[2,3,9,10],[4,5,6,7,8]][tierFor(a,n)]);
function wrongOpts(correct, pool, n=3){ return shuffle(pool.filter(x => x !== correct)).slice(0,n); }
function stepRow(notes, steps, hi){
  return h('div',{class:'tscroll'}, h('div',{class:'seq'}, notes.flatMap((n,i) => {
    const el = h('div',{class:'nt'}, h('small',{}, i+1), h('b',{}, nm(n)));

    return i<steps.length ? [el, h('div',{class:'st '+steps[i]}, steps[i])] : [el];
  })));
}

function numeralMix(mode){
  let used = [];
  return { id:'mix', title:'Numerals and chords', mastery:3,
    make:(a,n) => {
      const key = lpick(a,n,mode,rootsFor(mode).filter(r => diatonic(r,mode).every(d => isClean(d.notes)))), dn = diatonic(key,mode);
      used = used.slice(0,a);                       // only the questions already passed count
      const qs = used.map(i => dn[i].q), remaining = n - a;
      const missing = ['maj','min'].filter(x => !qs.includes(x));
      let cand = [0,1,2,3,4,5,6].filter(i => !used.includes(i));
      if(missing.length >= remaining){ const want = pick(missing); cand = cand.filter(i => dn[i].q === want); }
      const i = pick(cand.length ? cand : [0,1,2,3,4,5,6]); used[a] = i;
      return {key, dn, i, dir:Math.random()<0.5}; },
    view:(q,api) => { const roms = q.dn.map(d => romanOf(d.spec,mode)); const idx = shuffle([0,1,2,3,4,5,6].filter(x => x!==q.i)).slice(0,3).concat(q.i); const opts = shuffle(idx);
      return q.dir
        ? qChoice({prompt:`In <b>${nm(q.key)} ${mode}</b>, which chord is <b>${roms[q.i]}</b>?`, options:opts.map(x => q.dn[x].sym), answer:opts.indexOf(q.i), explain:`${roms[q.i]} is the chord on the ${q.i+1}${['st','nd','rd'][q.i]||'th'} note.`}, api)
        : qChoice({prompt:`In <b>${nm(q.key)} ${mode}</b>, the chord <b>${q.dn[q.i].sym}</b> is which Roman numeral?`, options:opts.map(x => roms[x]), answer:opts.indexOf(q.i), explain:`${q.dn[q.i].sym} sits on the ${q.i+1}${['st','nd','rd'][q.i]||'th'} note of the scale.`}, api); } };
}

        return qChoice({prompt:'Both clips end on the home chord. Which one has the stronger pull into the last chord?', listen:[{label:'Clip 1', fn:() => playEvents(clip(A,q.k,'minor'))},{label:'Clip 2', fn:() => playEvents(clip(B,q.k,'minor'))}],
          options:['Clip 1','Clip 2'], answer:q.first?0:1, explain:'The one with the major V chord, because its raised 3rd is a leading tone.'}, api); }});
    L.ex({id:'chords', title:'Dominant chords in a minor key', mastery:2,
      make:(a,n) => ({k:lpick(a,n,'minor',rootsFor('minor').filter(r => [S(4,'maj'),S(4,'dom7'),S(6,'dim',1)].every(s => isClean(resolve(r,'minor',s).notes))))}),
      view:(q,api) => { const rs = [S(4,'maj'),S(4,'dom7'),S(6,'dim',1)].map(s => resolve(q.k,'minor',s));

LESSONS.push({ id:'borrowed', unit:'u8', title:'Borrowing from the parallel minor', sub:'Take a chord from the minor key that shares your home note.', exIds:['spot','ear'],

LESSONS.push({ id:'secondary', unit:'u9', title:'Secondary dominants', sub:'Give any chord its own dominant, and it briefly becomes home.', exIds:['name','id'],

    L.callout('To find V7/x: take the chord x, go up a fifth for the root of the new chord, and make it a dominant 7th. In C major, V7/ii is A7, because A is a fifth above D and A7 resolves nicely to Dm.');

        return qChoice({prompt:`In <b>${nm(k)} major</b>, the progression <b>${nm(k)} – ${sd.sym} – ${tgt.sym}</b> includes a chord that is not in the key. What numeral describes <b>${sd.sym}</b>?`, options:opts, answer:opts.indexOf(sd.roman),

LESSONS.push({ id:'related', unit:'u10', title:'Closely related keys', sub:'Which keys are easy to move to, and why.', exIds:['near','diff'],
  build(L){
    L.p('To <b>modulate</b> is to change key partway through a song. It lifts the energy, marks a new section, or makes the last chorus feel bigger. Some key changes are smooth and some are a jolt, and the difference comes down to how many notes the two keys share.');
    L.p('Back to the circle of fifths. A key and its neighbours share all but one of their notes. Select C major and notice that G major differs by just one note (F♯). Select D major and see that it differs from C by two.');
    L.add(CircleOfFifths());
    L.callout('From any major key, the closest relatives are: the key a fifth above (V), the key a fifth below (IV), and the relative minor (vi). In C major those are <b>G major, F major and A minor</b>. D minor and E minor are close as well.');
    L.ex({id:'near', title:'Which key is a neighbour?', mastery:3,
      make:(a,n) => ({i:fifthIdx(a,n), side:pick([1,11])}),
      view:(q,api) => { const k = FIFTHS[q.i], ans = FIFTHS[(q.i+q.side)%12]; const far = shuffle([3,4,6,8,9].map(d => FIFTHS[(q.i+d)%12])).slice(0,3); const opts = shuffle([ans,...far]);
        return qChoice({prompt:`Which of these keys is a <b>neighbour</b> of <b>${nm(k)} major</b> on the circle of fifths?`, options:opts.map(n => nm(n)+' major'), answer:opts.indexOf(ans), explain:`${nm(ans)} major sits next to ${nm(k)} major, so they share six notes.`}, api); }});
    L.ex({id:'diff', title:'How many notes change?', mastery:3,
      make:(a,n) => ({i:fifthIdx(a,n), step:pick([1,2,3]), side:pick([1,-1])}),
      view:(q,api) => { const a = FIFTHS[q.i], b = FIFTHS[mod(q.i+q.side*q.step,12)]; const sa = scaleNotes(a,'major').map(pc), sb = scaleNotes(b,'major').map(pc); const diff = sb.filter(x => !sa.includes(x)).length;

LESSONS.push({ id:'pivot', unit:'u10', title:'Pivot chord modulation', sub:'Use a chord both keys share as a hinge.', exIds:['find','numeral'],
  build(L){
    L.p('The smoothest key change uses a <b>pivot chord</b>: a chord that belongs to both keys. You play it while still in the first key, then hear it a different way as part of the second key.');

    L.p('Pick any two keys and the table lists every chord they share, with its numeral in each key.');
    L.add(PivotFinder());
    L.h2('The recipe');
    L.callout('1. Start in the old key.<br>2. Move to a pivot chord (one that fits both keys, ideally a ii or IV in the new key).<br>3. Play the new key’s V7.<br>4. Land on the new I.');
    const pairMake = (a,n) => { let i, side; do { i = fifthIdx(a,n); side = pick([1,11]); const j = (i+side)%12; if(!((i===6&&j===7)||(i===7&&j===6))) break; } while(true); return {i, side}; };

      view:(q,api) => { const A = FIFTHS[q.i], B = FIFTHS[(q.i+q.side)%12]; const da = diatonic(A,'major'), db = diatonic(B,'major'); const shared = da.filter(x => db.some(y => y.sym===x.sym)), notShared = da.filter(x => !db.some(y => y.sym===x.sym));
        const ans = da[q.ad]; const opts = shuffle([ans, ...shuffle(notShared).slice(0,3)]);
        return qChoice({prompt:`You are modulating from <b>${nm(A)} major</b> to <b>${nm(B)} major</b>. Which chord could act as a pivot?`, options:opts.map(o => o.sym), answer:opts.indexOf(ans), hint:'A pivot must be one of the seven chords in BOTH keys.', explain:`${ans.sym} is in ${nm(A)} major and in ${nm(B)} major.`}, api); }});
    L.ex({id:'numeral', title:'One chord, two jobs', mastery:3,
      sig:q => q.ad,
      make:(a,n) => { const p = pairMake(a,n), A = FIFTHS[p.i], B = FIFTHS[(p.i+p.side)%12], da = diatonic(A,'major'), db = diatonic(B,'major'); return {...p, ad:pick(da.filter(x => db.some(y => y.sym===x.sym))).deg}; },
      view:(q,api) => { const A = FIFTHS[q.i], B = FIFTHS[(q.i+q.side)%12]; const da = diatonic(A,'major'), db = diatonic(B,'major'); const pairs = da.map(x => ({x, y:db.find(y => y.sym===x.sym)})).filter(p => p.y); const p = pairs.find(pp => pp.x.deg===q.ad);
        const roms = ['I','ii','iii','IV','V','vi','vii°']; const ans = roms[p.y.deg]; const opts = shuffle([ans, ...shuffle(roms.filter(r => r!==ans)).slice(0,3)]);
        return qChoice({prompt:`<b>${p.x.sym}</b> is <b>${roms[p.x.deg]}</b> in ${nm(A)} major. Which numeral is it in <b>${nm(B)} major</b>?`, options:opts, answer:opts.indexOf(ans), explain:`${p.x.sym} is ${ans} in ${nm(B)} major.`}, api); }});
  }});

const App = {
  cur:null, open:new Set(),
  mastered(l){ return l.exIds.filter(e => Store.d.m && Store.d.m[l.id+'/'+e]).length; },
  isDone(l){ return l.exIds.length ? this.mastered(l) === l.exIds.length : !!(Store.d.seen && Store.d.seen[l.id]); },
  isPart(l){ return !this.isDone(l) && l.exIds.some(e => (Store.d.ex[l.id+'/'+e]||0) > 0); },
  refresh(){ this.drawRail(); this.drawMeter(); this.drawBanner(); },
  drawMeter(){
    const done = LESSONS.filter(l => this.isDone(l)).length;
    document.getElementById('meterbar').style.width = (100*done/LESSONS.length)+'%';
    document.getElementById('metertxt').textContent = done + ' of ' + LESSONS.length + ' lessons';
  },
  drawBanner(){
    const b = document.getElementById('donebn'); if(!b || !this.cur) return;
    const next = LESSONS[LESSONS.indexOf(this.cur)+1];
    b.hidden = !(this.cur.exIds.length && this.isDone(this.cur));
    b.textContent = next ? 'Lesson complete. Next up: ' + next.title + '.' : 'Course complete. Well done.';
  },
  drawRail(){
    const rail = document.getElementById('rail'); rail.replaceChildren();
    UNITS.forEach(u => {
      const ls = LESSONS.filter(l => l.unit===u.id); if(!ls.length) return;
      const done = ls.filter(l => this.isDone(l)).length, isOpen = this.open.has(u.id);
      const head = h('button',{class:'uh','aria-expanded':isOpen?'true':'false', onclick:() => { if(this.open.has(u.id)) this.open.delete(u.id); else this.open.add(u.id); this.drawRail(); }},
        h('span',{class:'chev'}, '▶'), u.title, h('span',{class:'cnt'}, done+'/'+ls.length));
      rail.append(h('div',{class:'unit'}, head, h('div',{class:'ul'}, ls.map(l => h('button',{class:'lnk'+(this.isDone(l)?' done':this.isPart(l)?' part':''), 'aria-current':this.cur&&this.cur.id===l.id?'true':'false', onclick:() => this.show(l.id)},
        h('span',{class:'dot'}, this.isDone(l)?'✓':''), l.title)))));
    });
    const rs = h('div',{class:'unit', style:'margin-top:14px'});
    let armed = false;
    const b = h('button',{class:'btn ghost sm', onclick:() => { if(!armed){ armed = true; b.textContent = 'Tap again to erase all progress'; return; } Store.d = {ex:{},m:{},seen:{},last:null}; Store.save(); this.show('notes'); }}, 'Reset progress');
    rs.append(b); rail.append(rs);
  },
  makeL(l){
    const root = h('div',{class:'lesson'}); let started = false;
    const L = { id:l.id, el:root,
      h2:t => root.append(h('h2',{}, t)),
      p:html => root.append(h('p',{html})),
      callout:(html,kind,label) => root.append(h('div',{class:'callout '+(kind||'')}, h('span',{class:'lbl'}, label || 'Key idea'), h('div',{html}))),
      wild:(html) => root.append(h('details',{class:'wild'}, h('summary',{}, 'Hear it in a real song'), h('div',{}, h('div',{html}), h('small',{}, 'Chords as commonly played. Recordings and charts can differ, so treat these as starting points.')))),
      add:el => root.append(el),
      ex:def => { if(!started){ started = true; root.append(h('div',{class:'practise'}, h('h2',{}, 'Practise'), h('p',{}, 'You get a fresh question each time. The dots show how many you need to get right. Once an exercise is complete it locks, so you always know what is done.'))); } root.append(Exercise(L, def)); } };
    return L;
  },
  show(id){
    const l = LESSONS.find(x => x.id===id) || LESSONS[0]; this.cur = l;
    this.open = new Set([l.unit]);
    Store.d.last = l.id; try{ history.replaceState(null,'','#'+l.id); }catch(e){} if(!l.exIds.length){ Store.d.seen = Store.d.seen || {}; Store.d.seen[l.id] = 1; } Store.save();
    stopAudio();
    const main = document.getElementById('main'); main.replaceChildren();
    const L = this.makeL(l); const u = UNITS.find(x => x.id===l.unit); const idx = LESSONS.indexOf(l);
    const inUnit = LESSONS.filter(x => x.unit===l.unit);
    L.el.append(h('div',{class:'eyebrow'}, u.title+' · '+(inUnit.indexOf(l)+1)+' of '+inUnit.length), h('h1',{}, l.title), h('p',{class:'sub'}, l.sub));
    if(idx===0 && !Object.keys(Store.d.ex).length) L.callout('Tap any ▶ button or piano key to hear it. Each lesson ends with short exercises, and your progress is saved in this browser.', 'tip', 'How this works');
    l.build(L);
    const prev = LESSONS[idx-1], next = LESSONS[idx+1];
    L.el.append(h('div',{class:'done-banner', id:'donebn', hidden:true}));
    L.el.append(h('div',{class:'pager'}, prev ? h('button',{class:'btn', onclick:() => this.show(prev.id)}, '← '+prev.title) : h('span'), next ? h('button',{class:'btn pri', onclick:() => this.show(next.id)}, next.title+' →') : h('span')));
    main.append(L.el);
    document.getElementById('rail').classList.remove('open');
    window.scrollTo(0,0);
    this.refresh();
  },
  init(){
    Store.load(); Store.d.m = Store.d.m || {}; Store.d.seen = Store.d.seen || {};
    const top = document.getElementById('top');
    top.append(h('button',{class:'btn menu-btn', 'aria-label':'Show lessons', onclick:() => document.getElementById('rail').classList.toggle('open')}, '☰ Lessons'),
      h('div',{class:'brand', html:'Harmony from <b>Scratch</b>'}),
      h('div',{class:'meter'}, h('div',{class:'bar'}, h('i',{id:'meterbar'})), h('span',{id:'metertxt'})));
    let start = Store.d.last; const hash = (location.hash||'').slice(1); if(LESSONS.some(l => l.id===hash)) start = hash;
    this.show(LESSONS.some(l => l.id===start) ? start : LESSONS[0].id);
  },
};
let started = false; const boot = () => { if(started) return; started = true; App.init(); };
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
